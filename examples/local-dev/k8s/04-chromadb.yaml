apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chromadb
  namespace: ai4ia
spec:
  serviceName: chromadb
  replicas: 1     # chroma has no clustering — do not scale this
  selector:
    matchLabels:
      app: chromadb
  template:
    metadata:
      labels:
        app: chromadb
    spec:
      containers:
        - name: chromadb
          image: chromadb/chroma:1.5.9
          ports:
            - containerPort: 8000
          env:
            - name: IS_PERSISTENT
              value: "TRUE"
            - name: ANONYMIZED_TELEMETRY
              value: "FALSE"
            - name: CHROMA_SERVER_AUTHN_PROVIDER
              value: ""
            - name: CHROMA_SEGMENT_CACHE_POLICY
              value: "ALL"
          volumeMounts:
            - name: chroma-data
              mountPath: /data
          resources:
            requests: { cpu: "500m", memory: "2Gi" }
            limits: { cpu: "2", memory: "6Gi" }
      volumes:
        # hostPath is rejected outright by this namespace's PodSecurity
        # "baseline" enforcement (confirmed: StatefulSet silently never
        # created a pod — status showed replicas: 0 with zero events).
        # emptyDir is allowed under baseline and unblocks this today.
        # Tradeoff: data is lost on pod restart/reschedule — re-run the
        # embedding import (see chat) after any Chroma pod disruption.
        # Swap to a real PVC (volumeClaimTemplates below) once a
        # StorageClass exists — node labels show a Weka CSI driver is
        # already installed (topology.wekafs.csi/node on your nodes),
        # just not exposed as a StorageClass to this namespace yet — ask
        # your cluster admin to create one from it.
        - name: chroma-data
          emptyDir: {}
# volumeClaimTemplates:  (use this instead, once a StorageClass exists)
#   - metadata:
#       name: chroma-data
#     spec:
#       accessModes: ["ReadWriteOnce"]
#       storageClassName: <your-storage-class>
#       resources:
#         requests:
#           storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: chromadb
  namespace: ai4ia
spec:
  selector:
    app: chromadb
  ports:
    - port: 8000
      targetPort: 8000