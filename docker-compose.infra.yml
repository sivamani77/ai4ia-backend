services:
  chromadb:
    image: chromadb/chroma:1.5.9
    ports:
      - "8001:8000"
    volumes:
      - ./data/chroma:/data
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - CHROMA_SERVER_AUTHN_PROVIDER=
      - CHROMA_SEGMENT_CACHE_POLICY=ALL
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v2/heartbeat', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
