[project]
name = "ai4ia-demo-pipeline-backend"
version = "0.1.0"
description = "AI4IA Demo Video Studio — backend API and pipeline services"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "requests",
    "httpx",
    "psycopg2-binary",
    "numpy",
    "tqdm",
    "pillow",
    "edge-tts",
    "python-multipart",
    "aiofiles",
    "supabase",
    "celery",
    "redis",
    "chromadb",
    "boto3",
    "python-json-logger",
    "argon2-cffi",
    "pyjwt",
    "email-validator",
    "python-dateutil",
    "prometheus-client",
    "prometheus-fastapi-instrumentator",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-jaeger-thrift==1.21.0",
    "opentelemetry-instrumentation==0.44b0",
    "opentelemetry-instrumentation-asgi==0.44b0",
    "opentelemetry-instrumentation-fastapi==0.44b0",
    "opentelemetry-instrumentation-requests==0.44b0",
    "opentelemetry-instrumentation-celery==0.44b0",
    "opentelemetry-instrumentation-httpx==0.44b0",
    "opentelemetry-instrumentation-psycopg2==0.44b0",
    "opentelemetry-instrumentation-logging==0.44b0",
    # opentelemetry-instrumentation==0.44b0 imports pkg_resources at runtime,
    # which setuptools>=81 no longer ships. Pin below that.
    "setuptools<81",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
