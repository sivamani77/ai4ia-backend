# With AI4IA_STORAGE_BACKEND=s3, exports/assets/embeddings/ingest data all go
# to S3 (storage_service.py, s3_helpers.py, ingest_job_runner.py) — none of
# those need PVCs anymore, which is convenient since this cluster has no
# StorageClass at all (`kubectl get storageclass` → no resources).
#
# job pipeline writes media_registry.json to local disk first, then (in S3
# mode) uploads it to S3 and keeps a local copy "so the API can serve
# immediately" (storage_service.py: upload_job_outputs_to_s3). If that S3
# upload ever fails, the only copy is on whichever pod wrote it — so this is
# scratch space, not a hard dependency. Using emptyDir on both pods for now;
# swap to a real PVC once your cluster has a StorageClass.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai4ia-jobs-scratch-note
  namespace: ai4ia
data:
  note: >-
    jobs-data is defined as emptyDir directly in 10-api.yaml and 11-worker.yaml,
    not here. This file is intentionally left with no PVCs while S3 backend is
    in use and no StorageClass exists on the cluster.