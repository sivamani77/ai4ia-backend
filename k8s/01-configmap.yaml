# Non-secret settings — maps 1:1 to backend/app/core/settings.py fields.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai4ia-config
  namespace: ai4ia
data:
  OLLAMA_BASE_URL: "http://ollama-mobius-sales.mobiusdtaas.ai"
  VLLM_BASE_URL: "http://vllm-gpt-oss.mobiusdtaas.ai"
  VLLM_MODEL: "openai/gpt-oss-20b"
  # If Redis requires auth, put the password in the ai4ia-secrets Secret's
  # REDIS_PASSWORD key (see 02-secret.yaml.example) rather than embedding it
  # here — settings.py merges the two at startup.
  REDIS_URL: "redis://redis:6379/0"

  # ChromaDB — HTTP mode, pointed at the in-cluster StatefulSet service
  CHROMA_MODE: "http"
  CHROMA_HOST: "chromadb"
  CHROMA_PORT: "8000"
  CHROMA_SSL: "false"
  CHROMA_COLLECTION: "fragments"

  ALLOWED_ORIGINS: '["https://ai4ia.io","http://localhost:8080","https://ai4iah.gov-cloud.ai","https://d2voopzhlp2jkx.cloudfront.net"]'

  ENABLE_AUTO_SYNC: "false"
  WORKER_CONCURRENCY: "2"
  WORKER_QUEUE: "video_jobs"
  WORKER_LOGLEVEL: "info"

  # Model gate — see backend/app/services/model_gate.py and
  # backend/app/core/settings.py for what each of these controls.
  MODEL_GATE_ENABLED: "true"
  MODEL_WARMUP_ON_LOGIN: "true"
  MODEL_PROBE_CACHE_SECONDS: "15"
  MODEL_GATE_INLINE_WAIT_SECONDS: "10"
  MODEL_WARM_DEADLINE_SECONDS: "600"
  MODEL_WARM_LOCK_SECONDS: "300"
  OLLAMA_KEEP_ALIVE: "5m"
  MODEL_EMBEDDING_WARM_TIMEOUT_SECONDS: "45"

  # S3 storage backend — switches exports/assets/storylines/ingest pipeline
  # output to S3 instead of local disk (see storage_service.py / s3_helpers.py).
  # No StorageClass exists on this cluster, so this is required, not optional.
  AI4IA_STORAGE_BACKEND: "s3"
  AI4IA_OBJECT_STORAGE_BUCKET: "ai4ia-data"        # <-- change to your bucket
  AI4IA_OBJECT_STORAGE_REGION: "ap-south-2"             # <-- change to your region
  AI4IA_OBJECT_STORAGE_ENDPOINT: ""                    # only set for non-AWS S3-compatible

  # OpenTelemetry traces (see backend/app/core/otel.py). Leave unset to
  # disable tracing entirely (safe default — api/worker skip all
  # instrumentation when this is empty). Point it at the in-cluster OTel
  # Collector once DevOps stands one up, e.g.
  # "http://otel-collector.ai4ia.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""