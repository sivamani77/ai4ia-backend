name: Mobius Caller Workflow
on:
  push:
    branches: [ dev, release, master, nexusconnects, uat ]
jobs:
  dev_job:
    if: github.ref == 'refs/heads/dev'
    uses: gaiangroup/access/.github/workflows/python-ai4ia-nexusconnects.yaml@config
    with:
      SERVICE_CODE: ai4ia-backend
    secrets: inherit
  prod_job:
    if: github.ref == 'refs/heads/prod'
    uses: gaiangroup/access/.github/workflows/python-ai4ia-nexusconnects.yaml@config
    with:
      SERVICE_CODE: ai4ia-backend
    secrets: inherit
  master_job:
    if: github.ref == 'refs/heads/master'
    uses: gaiangroup/access/.github/workflows/python-ai4ia-nexusconnects.yaml@config
    with:
      SERVICE_CODE: ai4ia-backend
    secrets: inherit

  uat_job:
    if: github.ref == 'refs/heads/uat'
    uses: gaiangroup/access/.github/workflows/ai4ia-backend-test-ci.yml@config
    with:
      SERVICE_CODE: ai4ia-backend-test
    secrets: inherit


  release_job:
    if: github.ref == 'refs/heads/release'
    uses: gaiangroup/access/.github/workflows/python-mobius-graph-operations-release-config.yaml@config
    with:
      SERVICE_CODE: ai4ia-backend
    secrets: inherit
  unauthorized_branch_job:
    if: github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/release' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/release'
    runs-on: ubuntu-latest
    steps:
      - name: This is not an authorized branch, please Run on DEV or Prod Branch
        run: echo "This is not an authorized branch. please Run on DEV or Prod  Branch"
